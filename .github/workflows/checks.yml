name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate protocol, evidence status and links
        run: python3 scripts/validate_design.py
      - name: Validate published market-pilot results and independent-replay provenance
        run: python3 scripts/validate_pilot_artifacts.py
      - name: Validate stock-pilot results and independent replay
        run: python3 scripts/validate_stock_pilot_artifacts.py
      - name: Test ingestion and research engine with synthetic inputs only
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise every synthetic strategy and cost scenario
        run: python3 scripts/run_synthetic.py --output-dir "$RUNNER_TEMP/spmo-synthetic"
      - name: Exercise all prespecified semiannual calendar phases
        run: python3 scripts/run_calendar_sensitivity.py --output-dir "$RUNNER_TEMP/spmo-calendar-sensitivity"
      - name: Check site JavaScript syntax
        run: node --check site/app.js
      - name: Check market-pilot report JavaScript syntax
        run: node --check site/pilot.js
      - name: Check stock-pilot report JavaScript syntax
        run: node --check site/stocks.js
