name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install IANA timezone data for Windows
        if: runner.os == 'Windows'
        run: python -m pip install tzdata==2026.4
      - name: Validate protocol, evidence status and links
        run: python -X utf8 scripts/validate_design.py
      - name: Validate published market-pilot results and independent-replay provenance
        run: python -X utf8 scripts/validate_pilot_artifacts.py
      - name: Validate stock-pilot results and independent replay
        run: python -X utf8 scripts/validate_stock_pilot_artifacts.py
      - name: Validate the calendar and tranche validation case
        run: python -X utf8 scripts/validate_validation_artifacts.py
      - name: Validate release evidence and owner contribution status
        run: python -X utf8 scripts/validate_release_integrity.py
      - name: Test ingestion and research engine with synthetic inputs only
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise every synthetic strategy and cost scenario
        run: python -X utf8 scripts/run_synthetic.py --output-dir "$RUNNER_TEMP/spmo-synthetic"
      - name: Exercise all prespecified semiannual calendar phases
        run: python -X utf8 scripts/run_calendar_sensitivity.py --output-dir "$RUNNER_TEMP/spmo-calendar-sensitivity"
      - name: Check site JavaScript syntax
        run: node --check site/app.js
      - name: Check market-pilot report JavaScript syntax
        run: node --check site/pilot.js
      - name: Check stock-pilot report JavaScript syntax
        run: node --check site/stocks.js
      - name: Reject incomplete or stale ETF explorer results
        run: node --test tests/test_pilot_ui.mjs
      - name: Check the validation explorer and every saved scenario
        run: node --check site/validation.js && node --test tests/test_validation_ui.mjs

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned numerical analysis environment
        run: python -m pip install -r requirements-analysis.txt
      - name: Exercise numerical analysis and tranche accounting without private data
        run: python -m unittest discover -s tests -p 'test_*.py' -v
